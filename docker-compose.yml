# Base común a desarrollo y producción.
#
#   Windows (desarrollo):  docker compose up --build
#       -> docker-compose.override.yml se aplica SOLO y se aplica AUTOMÁTICAMENTE,
#          añadiendo recarga en caliente, mock de Gmail y el depurador.
#
#   Unraid (producción):   ver deploy/docker-compose.unraid.yml
#
# Las variables se leen de .env (copia .env.example a .env la primera vez).
services:
  deliver-tracker:
    build: .
    image: deliver-tracker:local
    container_name: deliver-tracker
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      # ./data guarda packages.db y, si conectas Gmail real, credentials.json
      # + token.json. Es lo único que hay que respaldar.
      - ./data:/data
    environment:
      # En Windows/WSL el bind-mount es permisivo y 1000 vale; en Unraid hay que
      # poner 99:100 (ver deploy/docker-compose.unraid.yml).
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DB_PATH: /data/packages.db
      USE_MOCK_GMAIL: "${USE_MOCK_GMAIL:-false}"
      ENABLE_BACKGROUND_WORKER: "${ENABLE_BACKGROUND_WORKER:-true}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-change-me-in-production}"
      TZ: "${TZ:-Europe/Madrid}"
      # Ventana de busqueda en Gmail. La normal es adaptativa (cubre el hueco
      # desde el ultimo escaneo con exito); estas son sus cotas. Ver README.
      GMAIL_FIRST_SCAN_DAYS: "${GMAIL_FIRST_SCAN_DAYS:-30}"
      GMAIL_MIN_LOOKBACK_DAYS: "${GMAIL_MIN_LOOKBACK_DAYS:-14}"
      GMAIL_MAX_LOOKBACK_DAYS: "${GMAIL_MAX_LOOKBACK_DAYS:-365}"
      SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL_MINUTES:-60}"
      # Hora que se MUESTRA en el panel (lo guardado siempre es UTC).
      DISPLAY_TZ: "${DISPLAY_TZ:-${TZ:-Europe/Madrid}}"
      # Los entregados se van solos a la papelera tras estos dias. 0 lo desactiva.
      PURGE_DELIVERED_AFTER_DAYS: "${PURGE_DELIVERED_AFTER_DAYS:-30}"
      # Copia diaria de la base en /data/backups.
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
      # Contrasena del panel. Vacia = sin autenticacion (normal en una LAN).
      PANEL_USER: "${PANEL_USER:-admin}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      # Integración Home Assistant (MQTT Discovery). Desactivada por defecto;
      # pon MQTT_ENABLED=true y rellena el resto para publicar cada paquete
      # como sensor en HA.
      MQTT_ENABLED: "${MQTT_ENABLED:-false}"
      MQTT_HOST: "${MQTT_HOST:-}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_DISCOVERY_PREFIX: "${MQTT_DISCOVERY_PREFIX:-homeassistant}"
    restart: unless-stopped
