name: Publicar imagen

# Construye la imagen y la sube a GitHub Container Registry (ghcr.io), para que
# Unraid sólo tenga que hacer `docker compose pull`.
#
# Se publica SÓLO si los tests pasan: si algo se rompe, Unraid se queda con la
# imagen anterior, que funcionaba.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Cambios que no afectan a la imagen no gastan minutos de CI.
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

  publicar:
    name: Construir y publicar
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        # ghcr.io sólo acepta minúsculas, y el owner aquí lleva mayúsculas.
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # El target 'prod' es el de gunicorn, sin pytest ni debugpy.
          target: prod
          # Unraid es x86: compilar también para arm64 duplicaría el tiempo sin
          # que nadie lo use. Cámbialo si algún día lo mueves a un ARM.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La caché entre ejecuciones evita reinstalar las dependencias cuando
          # sólo ha cambiado el código.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "En Unraid:"
            echo '```bash'
            echo "cd /boot/config/plugins/compose.manager/projects/deliver-tracker"
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
