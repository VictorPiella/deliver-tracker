<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paquetes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <h1>MANIFI<span class="accent">E</span>STO</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="meta">{{ packages_count|default('') }}</span>
      <form action="{{ url_for('trigger_sync') }}" method="post" style="margin:0;">
        <button class="sync-btn" type="submit">Escanear ahora</button>
      </form>
    </div>
  </div>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
